<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">KLIK AutoCut — talking-head raws to a clean cut in Premiere Pro. Closed beta.</title>
  <desc id="desc">The KLIK AutoCut wordmark on charcoal beside an illustrated Premiere timeline: a long raw clip with retakes struck out above, and the tidy cut below with J-cuts, crossfades and subtitles.</desc>
  <defs>
    <radialGradient id="warm" cx=".5" cy=".5" r=".5"><stop stop-color="#C2501C" stop-opacity=".55"/><stop offset="1" stop-color="#C2501C" stop-opacity="0"/></radialGradient>
    <radialGradient id="cool" cx=".5" cy=".5" r=".5"><stop stop-color="#3A4250" stop-opacity=".5"/><stop offset="1" stop-color="#3A4250" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#2A2C31" stop-opacity=".92"/><stop offset="1" stop-color="#1A1B1F" stop-opacity=".92"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FFFFFF" stop-opacity=".16"/><stop offset=".5" stop-color="#FFFFFF" stop-opacity=".03"/><stop offset="1" stop-color="#FFFFFF" stop-opacity=".02"/></linearGradient>
    <linearGradient id="clip" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#FF8A52"/><stop offset="1" stop-color="#E9622A"/></linearGradient>
    <linearGradient id="clipdim" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#5A5D66"/><stop offset="1" stop-color="#474951"/></linearGradient>
    <linearGradient id="aud" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#4CC08A"/><stop offset="1" stop-color="#2F9E6E"/></linearGradient>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#2A2B30"/><path d="M0 0v7" stroke="#3B3D44" stroke-width="2.4"/></pattern>
    <clipPath id="frame"><rect width="1200" height="400" rx="28"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="400" fill="#0F1012"/>
    <ellipse cx="1010" cy="420" rx="460" ry="250" fill="url(#warm)"/>
    <ellipse cx="760" cy="-20" rx="360" ry="200" fill="url(#cool)"/>

    <!-- wordmark -->
    <g transform="translate(72 104)">
      <rect width="56" height="56" rx="17" fill="#FF7A3D"/>
      <g transform="translate(14 14) scale(1.17)" fill="none" stroke="#1A0E07" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88M14.47 14.48 20 20M8.12 8.12 12 12"/>
      </g>
      <text x="76" y="25" fill="#A0A5AD" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="3">KLIK</text>
      <text x="75" y="54" fill="#ECEDEF" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="-.5">AutoCut</text>
    </g>
    <text x="72" y="222" fill="#ECEDEF" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="300" letter-spacing="-.4">Raw takes in.</text>
    <text x="72" y="260" fill="#ECEDEF" font-family="-apple-system, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="300" letter-spacing="-.4">A clean cut out, in Premiere.</text>
    <g transform="translate(72 296)">
      <rect width="126" height="30" rx="15" fill="#FF7A3D" fill-opacity=".15"/>
      <circle cx="17" cy="15" r="3.5" fill="#FF9A66"/>
      <text x="29" y="20" fill="#FF9A66" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600">Closed beta</text>
      <text x="142" y="20" fill="#6E737C" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5">For Premiere Pro 2026 · macOS and Windows</text>
    </g>

    <!-- timeline panel -->
    <g transform="translate(588 52)">
      <rect width="560" height="296" rx="22" fill="url(#glass)"/>
      <rect x=".5" y=".5" width="559" height="295" rx="21.5" fill="none" stroke="url(#rim)"/>
      <circle cx="24" cy="24" r="4.5" fill="#3A3C43"/><circle cx="40" cy="24" r="4.5" fill="#3A3C43"/><circle cx="56" cy="24" r="4.5" fill="#3A3C43"/>
      <text x="84" y="29" fill="#6E737C" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5">Episode 12 · A-roll</text>

      <!-- before: raws with retakes -->
      <text x="24" y="66" fill="#6E737C" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1">RAWS</text>
      <g transform="translate(24 76)">
        <rect width="88" height="34" rx="7" fill="url(#hatch)"/>
        <rect x="92" width="112" height="34" rx="7" fill="url(#clipdim)"/>
        <rect x="208" width="56" height="34" rx="7" fill="url(#hatch)"/>
        <rect x="268" width="94" height="34" rx="7" fill="url(#clipdim)"/>
        <rect x="366" width="70" height="34" rx="7" fill="url(#hatch)"/>
        <rect x="440" width="72" height="34" rx="7" fill="url(#clipdim)"/>
        <g stroke="#6E737C" stroke-width="1.5" stroke-linecap="round" opacity=".9">
          <path d="M14 17h60M222 17h28M380 17h42"/>
        </g>
        <text x="100" y="22" fill="#C9CBD0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11">intro ✓</text>
        <text x="276" y="22" fill="#C9CBD0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11">point 2 ✓</text>
        <text x="448" y="22" fill="#C9CBD0" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11">outro ✓</text>
      </g>

      <!-- arrows -->
      <g fill="none" stroke="#FF7A3D" stroke-opacity=".55" stroke-width="1.5" stroke-dasharray="3 4">
        <path d="M172 112c0 22 -40 26 -60 44"/><path d="M339 112c0 22 -50 26 -76 44"/><path d="M500 112c0 22 -60 26 -90 44"/>
      </g>

      <!-- after: the cut -->
      <text x="24" y="150" fill="#6E737C" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1">THE CUT</text>
      <g transform="translate(24 160)">
        <rect width="150" height="34" rx="7" fill="url(#clip)"/>
        <rect x="153" width="128" height="34" rx="7" fill="url(#clip)"/>
        <rect x="284" width="118" height="34" rx="7" fill="url(#clip)"/>
        <g fill="#1A0E07" fill-opacity=".35"><rect x="10" y="12" width="70" height="3" rx="1.5"/><rect x="163" y="12" width="56" height="3" rx="1.5"/><rect x="294" y="12" width="48" height="3" rx="1.5"/></g>
        <!-- audio with J-cuts and crossfades -->
        <rect y="40" width="160" height="26" rx="7" fill="url(#aud)" fill-opacity=".9"/>
        <rect x="140" y="40" width="148" height="26" rx="7" fill="url(#aud)" fill-opacity=".75"/>
        <rect x="270" y="40" width="132" height="26" rx="7" fill="url(#aud)" fill-opacity=".9"/>
        <g stroke="#0F1012" stroke-opacity=".45" stroke-width="1.6" stroke-linecap="round">
          <path d="M14 53v0M22 47v12M30 50v6M38 45v16M46 49v8M54 46v14M62 51v4M70 47v12M78 44v18M86 50v6M94 47v12M102 45v16M110 50v6M118 48v10M126 46v14"/>
          <path d="M296 49v8M304 46v14M312 50v6M320 44v18M328 48v10M336 46v14M344 51v4M352 47v12M360 45v16M368 50v6M376 48v10"/>
        </g>
        <path d="M140 66 160 40M270 66 288 40" stroke="#ECEDEF" stroke-opacity=".7" stroke-width="1.4"/>
        <!-- subtitles -->
        <rect y="72" width="96" height="20" rx="6" fill="#8B86DE" fill-opacity=".85"/>
        <rect x="100" y="72" width="112" height="20" rx="6" fill="#8B86DE" fill-opacity=".85"/>
        <rect x="216" y="72" width="90" height="20" rx="6" fill="#8B86DE" fill-opacity=".85"/>
        <rect x="310" y="72" width="92" height="20" rx="6" fill="#8B86DE" fill-opacity=".85"/>
      </g>
      <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#A0A5AD">
        <text x="440" y="182">Video</text><text x="440" y="222">J-cuts + fades</text><text x="440" y="248">Subtitles</text>
      </g>
      <line x1="24" x2="536" y1="270" y2="270" stroke="#FFFFFF" stroke-opacity=".06"/>
      <text x="24" y="287" fill="#6E737C" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5">Retakes removed · last complete take kept · 14 min of raws → 4 min 32 s</text>
    </g>
  </g>
</svg>
